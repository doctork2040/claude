[workspace]

[package]
name = "tig-innovator-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
rand = { version = "0.8.5", default-features = false, features = ["std_rng", "small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tig-challenges = { path = "../../tig/tig-challenges", features = ["c003"] }
